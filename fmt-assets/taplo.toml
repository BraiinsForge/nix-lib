[formatting]
align_comments = false
array_auto_expand = false
array_auto_collapse = false
column_width = 120
indent_string = "    "


[[rule]]
include = ["**/Cargo.toml"]
keys = [
    "*dependencies",
    "target.*.*dependencies",
    "workspace.*dependencies",
    "workspace.lints.*",
]
[rule.formatting]
reorder_keys = true
reorder_arrays = true


# NOTE: `reorder_arrays` doesn't work for arrays directly, it only works if applied to a table that contains array
# values. We want to sort `workspace.members` so we have to have this extra rule as a workaround.
[[rule]]
include = ["**/Cargo.toml"]
keys = [
    "workspace",
]
[rule.formatting]
reorder_arrays = true
